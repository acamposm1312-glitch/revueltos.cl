function computeResultados(pedidos, gastos){
  var totalVenta=0, totalComision=0, facturaPagada=0, comisionRecibida=0, comisionPagadaTitin=0;
  var comisionPorRecibir=0, comisionPendienteTitin=0;
  pedidos.forEach(function(p){
    var venta = Number(p.montoVenta||0), comision = Number(p.montoComision||0);
    var facturaPagadaFlag = p.estadoFactura==="Pagado";
    totalVenta += venta; totalComision += comision;
    if(facturaPagadaFlag) facturaPagada += venta;
    if(p.estadoComision==="Pagado") comisionRecibida += comision;
    if(p.comisionTitinPagada==="Pagado") comisionPagadaTitin += comision;
    /* Solo cuentan como "pendiente" las comisiones de pedidos cuya factura
       ya fue pagada por el cliente — si la factura no se ha pagado, la
       comisión asociada no entra todavía a la cuenta de Andrés ni a la
       de Titin. */
    if(facturaPagadaFlag && p.estadoComision!=="Pagado") comisionPorRecibir += comision;
    if(facturaPagadaFlag && p.comisionTitinPagada!=="Pagado") comisionPendienteTitin += comision;
  });
  var facturaPendiente = totalVenta - facturaPagada;
  var totalGastos = ["sueldos","mercaderistas","otros"].reduce(function(s,k){
    return s + gastos[k].reduce(function(a,x){ return a+Number(x.monto||0); },0);
  },0);
  var utilidadNeta = totalComision - totalGastos;

  var mapCliente = {};
  pedidos.forEach(function(p){
    var c = p.cliente || "Sin especificar";
    if(!mapCliente[c]) mapCliente[c] = { cliente:c, venta:0, comision:0, pedidos:0 };
    mapCliente[c].venta += Number(p.montoVenta||0);
    mapCliente[c].comision += Number(p.montoComision||0);
    mapCliente[c].pedidos += 1;
  });
  var porCliente = Object.values(mapCliente).sort(function(a,b){ return b.venta-a.venta; });

  var mapMes = {};
  pedidos.forEach(function(p){
    var key = monthKey(p.fechaOrdenCompra);
    if(!key) return;
    if(!mapMes[key]) mapMes[key] = { mes:key, venta:0, comision:0 };
    mapMes[key].venta += Number(p.montoVenta||0);
    mapMes[key].comision += Number(p.montoComision||0);
  });
  var evolutivo = Object.values(mapMes).sort(function(a,b){ return a.mes.localeCompare(b.mes); })
    .map(function(x){ return Object.assign({}, x, { label: monthLabel(x.mes) }); });

  return {
    totalVenta:totalVenta, totalComision:totalComision, facturaPagada:facturaPagada, facturaPendiente:facturaPendiente,
    comisionRecibida:comisionRecibida, comisionPorRecibir:comisionPorRecibir,
    comisionPagadaTitin:comisionPagadaTitin, comisionPendienteTitin:comisionPendienteTitin,
    totalGastos:totalGastos, utilidadNeta:utilidadNeta, porCliente:porCliente, evolutivo:evolutivo
  };
}

    return '<div class="gasto-row">'
      + '<span class="td-strong">'+esc(x[meta.primaryKey]||meta.primaryFallback)+'</span>'
      + '<span class="td-mono">'+fmtDate(x.fecha)+'</span>'
      + '<span class="td-mono" style="text-align:right;font-weight:600">'+CLP(x.monto)+'</span>'
      + gastoEstadoSelectHtml(tipo, x)
      + '<button class="icon-link danger" data-action="removeGasto" data-tipo="'+tipo+'" data-id="'+x.id+'">'+ICONS.trash+'</button>'
      + '</div>';
  }).join("");
  if(items.length===0) rows = '<div class="empty-row">Sin registros todavía.</div>';
  return '<section class="gasto-section"><div class="gasto-head">'
    + '<div style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:'+meta.color+'"></span>'
      + '<div><div class="gasto-title">'+meta.title+'</div><div class="gasto-sub">'+meta.subtitle+'</div></div></div>'
    + '<button class="btn-ghost-sm" data-action="openGastoForm" data-tipo="'+tipo+'">'+ICONS.plus+' Añadir</button>'
    + '</div><div class="gasto-list">'+rows+'</div></section>';
}

function gastoFormHtml(tipo){
  var fields = GASTO_FIELDS[tipo].map(function(fl){
    return '<label class="field"><span class="field-label">'+fl.label+(fl.required?' <span class="req">*</span>':'')+'</span>'
      + '<input type="'+(fl.type||"text")+'" name="'+fl.key+'" placeholder="'+(fl.placeholder||"")+'"'+(fl.type==="number"?' min="0"':'')+' /></label>';
  }).join("");
  return '<form class="form-card" style="margin-top:-8px" data-action="submitGasto" data-tipo="'+tipo+'">'
    + '<div class="form-grid">'+fields+'</div>'
    + '<div class="form-actions"><button type="button" class="btn btn-ghost" data-action="cancelGastoForm">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div>'
    + '</form>';
}

/* ============================================================ */
/* CUENTA CON ANDRÉS — abonos/pagos que hace Andrés y saldo pendiente */
/* ============================================================ */
function andresCardHtml(){
  var r = computeResultados(STATE.pedidos, STATE.gastos);
  var gastosPendientes = gastosPendientesTotal(STATE.gastos);
  var totalAbonado = STATE.gastos.abonosAndres.reduce(function(s,x){ return s+Number(x.monto||0); },0);
  var totalAdeudado = r.comisionPorRecibir + gastosPendientes;
  var saldo = totalAdeudado - totalAbonado;

  var abonoRows = STATE.gastos.abonosAndres.slice().sort(function(a,b){ return (b.fecha||"").localeCompare(a.fecha||""); }).map(function(x){
    return '<div class="gasto-row abono-row">'
      + '<span class="td-strong">'+esc(x.nota||"Abono")+'</span>'
      + '<span class="td-mono">'+fmtDate(x.fecha)+'</span>'
      + '<span class="td-mono" style="text-align:right;font-weight:600;color:var(--sage)">'+CLP(x.monto)+'</span>'
      + '<button class="icon-link danger" data-action="removeAbono" data-id="'+x.id+'">'+ICONS.trash+'</button>'
      + '</div>';
  }).join("");
  if(STATE.gastos.abonosAndres.length===0) abonoRows = '<div class="empty-row">Sin abonos registrados todavía.</div>';

  var abonoForm = STATE.abonoFormOpen ? abonoFormHtml() : "";

  return '<div class="card" style="margin-top:4px">'
    + '<div class="card-head-row"><div><div class="card-title">Cuenta con Andrés</div><div class="card-sub">Comisiones y gastos pendientes de pago, versus lo que Andrés ya ha abonado.</div></div></div>'
    + '<div class="dynamic-grid" style="margin-top:16px">'
      + '<div class="dynamic-block"><div class="dynamic-head"><span>Comisiones pendientes</span></div><div class="stat-value mono" style="margin-top:4px;font-size:16px;color:var(--rust)">'+CLP(r.comisionPorRecibir)+'</div></div>'
      + '<div class="dynamic-block"><div class="dynamic-head"><span>Gastos pendientes</span></div><div class="stat-value mono" style="margin-top:4px;font-size:16px;color:var(--rust)">'+CLP(gastosPendientes)+'</div></div>'
      + '<div class="dynamic-block"><div class="dynamic-head"><span>Abonado por Andrés</span></div><div class="stat-value mono" style="margin-top:4px;font-size:16px;color:var(--sage)">'+CLP(totalAbonado)+'</div></div>'
    + '</div>'
    + '<div class="summary-line" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:15px">'
      + '<span class="lbl" style="font-weight:700;color:var(--ink)">Saldo pendiente con Andrés</span>'
      + '<span class="val" style="font-size:17px;color:'+(saldo>0?'var(--rust)':'var(--sage)')+'">'+CLP(saldo)+'</span>'
    + '</div>'
    + '<div class="gasto-head" style="margin-top:22px"><div><div class="gasto-title">Abonos de Andrés</div><div class="gasto-sub">Pagos que Andrés va haciendo para cubrir comisiones y gastos.</div></div>'
      + '<button class="btn-ghost-sm" data-action="openAbonoForm">'+ICONS.plus+' Añadir abono</button></div>'
    + '<div class="gasto-list" style="margin-top:10px">'+abonoRows+'</div>'
    + abonoForm
    + '</div>';
}

function abonoFormHtml(){
  var fields = ABONO_FIELDS.map(function(fl){
    return '<label class="field"><span class="field-label">'+fl.label+(fl.required?' <span class="req">*</span>':'')+'</span>'
      + '<input type="'+(fl.type||"text")+'" name="'+fl.key+'" placeholder="'+(fl.placeholder||"")+'"'+(fl.type==="number"?' min="0"':'')+' /></label>';
  }).join("");
  return '<form class="form-card" style="margin-top:12px" data-action="submitAbono">'
    + '<div class="form-grid">'+fields+'</div>'
    + '<div class="form-actions"><button type="button" class="btn btn-ghost" data-action="cancelAbonoForm">Cancelar</button><button type="submit" class="btn btn-primary">Guardar abono</button></div>'
    + '</form>';
}

/* ============================================================ */
/* RENDER: RESULTADOS */
/* ============================================================ */
function renderResultados(){
  var r = computeResultados(STATE.pedidos, STATE.gastos);
  var stats = statCard("Venta total histórica", CLP(r.totalVenta))
    + statCard("Comisión total ganada", CLP(r.totalComision), "wine")
    + statCard("Comisión Titin pendiente", CLP(r.comisionPendienteTitin), "rust")
    + statCard("Utilidad neta (comisión − gastos)", CLP(r.utilidadNeta), r.utilidadNeta>=0?"sage":"rust");

  var header = pageHeader("Panel de resultados", "Resultados", "Cómo va el negocio: mejor cliente, resumen dinámico de ventas y comisiones, y su evolución mes a mes.", "");

  var maxVenta = r.porCliente.length ? r.porCliente[0].venta : 1;
  var rankRows = r.porCliente.map(function(c,i){
    return '<div class="rank-row"><div class="rank-label-row">'
      + '<span class="rank-index">'+String(i+1).padStart(2,"0")+'</span>'
      + '<span class="rank-name">'+esc(c.cliente)+'</span>'
      + '<span class="rank-meta">'+c.pedidos+' pedido'+(c.pedidos!==1?"s":"")+' · comisión '+CLP(c.comision)+'</span>'
      + '</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(4,(c.venta/maxVenta)*100)+'%"></div></div>'
      + '<div class="rank-value">'+CLP(c.venta)+'</div></div>';
  }).join("");

  var mejorClienteCard = '<div class="card"><div class="card-head-row"><div style="display:flex;align-items:center;gap:10px">'
    + '<span class="trophy-badge">'+ICONS.trophy+'</span><div><div class="card-title">Mejor cliente</div><div class="card-sub">Ranking por volumen de venta acumulado</div></div>'
    + '</div></div><div style="margin-top:16px">'+rankRows+'</div></div>';

  function countPaid(field){ return STATE.pedidos.filter(function(p){ return p[field]==="Pagado"; }).length; }
  function dynamicBlock(label, paidLabel, paid, pending, total, count){
    return '<div class="dynamic-block"><div class="dynamic-head"><span>'+label+'</span><span class="dynamic-count">'+count+'/'+STATE.pedidos.length+'</span></div>'
      + '<div class="progress-track"><div class="progress-fill" style="width:'+pct(paid,total)+'%"></div></div>'
      + '<div class="dynamic-foot"><span>'+paidLabel+': <strong>'+CLP(paid)+'</strong></span><span class="pend">Pendiente: <strong>'+CLP(pending)+'</strong></span></div></div>';
  }
  var dynamicGrid = '<div class="dynamic-grid">'
    + dynamicBlock("Facturas","Pagadas", r.facturaPagada, r.facturaPendiente, r.totalVenta, countPaid("estadoFactura"))
    + dynamicBlock("Comisiones","Recibidas", r.comisionRecibida, r.comisionPorRecibir, r.totalComision, countPaid("estadoComision"))
    + dynamicBlock("Pago a Titin","Liquidado", r.comisionPagadaTitin, r.comisionPendienteTitin, r.totalComision, countPaid("comisionTitinPagada"))
    + '</div>';
  var dynamicCard = '<div class="card"><div class="card-title">Resumen dinámico de pagos</div><div class="card-sub">Se recalcula al instante según el estado de cada venta</div>'+dynamicGrid+'</div>';

  var areaChart = '<div class="card"><div class="card-title">Evolutivo de ventas</div><div class="card-sub">Monto de venta por mes, según fecha de orden de compra</div>'
    + '<div class="area-chart">'+areaChartSvg(r.evolutivo)+'</div></div>';

  var summaryCard = '<div class="card"><div class="card-title">Resumen de comisiones</div><div class="card-sub">Comisión total y estado de pago a Titin</div>'
    + '<div style="margin-top:18px;display:flex;flex-direction:column;gap:12px">'
      + '<div class="summary-line"><span class="lbl">Comisión total generada</span><span class="val">'+CLP(r.totalComision)+'</span></div>'
      + '<div class="summary-line"><span class="lbl">Pagada a Titin</span><span class="val" style="color:var(--sage)">'+CLP(r.comisionPagadaTitin)+'</span></div>'
      + '<div class="summary-line"><span class="lbl">Pendiente de pago</span><span class="val" style="color:var(--rust)">'+CLP(r.comisionPendienteTitin)+'</span></div>'
      + '<div class="progress-track"><div class="progress-fill" style="width:'+pct(r.comisionPagadaTitin,r.totalComision)+'%"></div></div>'
      + '<div class="progress-caption">'+pct(r.comisionPagadaTitin,r.totalComision)+'% de la comisión histórica ya está liquidada con Titin</div>'
    + '</div></div>';

  var barChart = '<div class="card"><div class="card-title">Evolutivo de comisiones</div><div class="card-sub">Comisión generada por mes</div>'
    + barChartHtml(r.evolutivo) + '</div>';

  return header + '<div class="stats">'+stats+'</div>' + mejorClienteCard + dynamicCard + areaChart
    + '<div class="two-col">' + summaryCard + barChart + '</div>';
}

function areaChartSvg(data){
  if(!data.length) return '<div class="empty-row">Sin datos suficientes todavía.</div>';
  var w=760, h=200, padL=6, padR=6, padT=10, padB=22;
  var maxV = Math.max.apply(null, data.map(function(d){ return d.venta; })) || 1;
  var stepX = data.length>1 ? (w-padL-padR)/(data.length-1) : 0;
  var pts = data.map(function(d,i){
    var x = padL + stepX*i;
    var y = padT + (1 - d.venta/maxV) * (h-padT-padB);
    return {x:x,y:y,d:d};
  });
  var linePath = pts.map(function(p,i){ return (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");
  var areaPath = linePath + " L"+pts[pts.length-1].x.toFixed(1)+","+(h-padB)+" L"+pts[0].x.toFixed(1)+","+(h-padB)+" Z";
  var gridLines = [0,0.25,0.5,0.75,1].map(function(t){
    var y = padT + t*(h-padT-padB);
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
  }).join("");
  var labels = pts.map(function(p){
    return '<text x="'+p.x+'" y="'+(h-6)+'" class="chart-axis-label" text-anchor="middle">'+esc(p.d.label)+'</text>';
  }).join("");
  var dots = pts.map(function(p){
    return '<circle cx="'+p.x+'" cy="'+p.y+'" r="2.6" fill="var(--wine)"/>';
  }).join("");
  var lastPt = pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Evolutivo de ventas por mes">'
    + '<defs><linearGradient id="ventaGrad" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="var(--wine)" stop-opacity="0.35"/><stop offset="100%" stop-color="var(--wine)" stop-opacity="0.02"/>'
      + '</linearGradient></defs>'
    + gridLines
    + '<path d="'+areaPath+'" fill="url(#ventaGrad)" stroke="none"/>'
    + '<path d="'+linePath+'" fill="none" stroke="var(--wine)" stroke-width="2.4" vector-effect="non-scaling-stroke"/>'
    + dots
    + '<circle cx="'+lastPt.x+'" cy="'+lastPt.y+'" r="4.2" fill="var(--wine)" stroke="var(--surface)" stroke-width="2"/>'
    + labels
    + '</svg>';
}

function barChartHtml(data){
  if(!data.length) return '<div class="empty-row">Sin datos suficientes todavía.</div>';
  var maxV = Math.max.apply(null, data.map(function(d){ return d.comision; })) || 1;
  var bars = data.map(function(d){
    var h = Math.max(2, (d.comision/maxV)*100);
    return '<div class="mbar"><div class="mbar-val">'+(d.comision?(d.comision/1e6).toFixed(1)+"M":"")+'</div>'
      + '<div class="mbar-track"><div class="mbar-fill" style="height:'+h+'%"></div></div>'
      + '<div class="mbar-lbl">'+esc(d.label)+'</div></div>';
  }).join("");
  return '<div class="mchart">'+bars+'</div>';
}

/* ============================================================ */
/* RENDER RAÍZ + EVENTOS */
/* ============================================================ */
function render(){
  var body = STATE.tab==="pedidos" ? renderPedidos() : STATE.tab==="gastos" ? renderGastos() : renderResultados();
  var warn = "";
  if(saveStatus==="unavailable") warn = '<div class="warn-banner">No se pudo activar el guardado compartido en este link — tus cambios sólo quedarán en este navegador. Usa "Copiar respaldo" antes de salir.</div>';
  else if(saveStatus==="readonly") warn = '<div class="warn-banner">Este link es de solo lectura: tus cambios no se pueden guardar aquí. Pide el link de edición para modificar los datos.</div>';
  else if(saveStatus==="error") warn = '<div class="warn-banner">No se pudo guardar el último cambio. Vuelve a intentarlo o usa "Copiar respaldo" para no perder tus datos.</div>';

  document.getElementById("app").innerHTML =
    '<div class="app">' + renderSidebar()
    + '<main class="main">' + renderTopbarMobile() + warn + body + '</main>'
    + '</div>'
    + (STATE.backupModal ? backupModalHtml() : "");

  var form = document.getElementById("pedido-form");
  if(form) form.querySelector('[name="cliente"]').focus();
}

function backupModalHtml(){
  if(STATE.backupModal==="export"){
    var json = JSON.stringify({ pedidos: STATE.pedidos, gastos: STATE.gastos, exportadoEl: new Date().toISOString() }, null, 2);
    return '<div class="modal-overlay" data-action="closeModal"><div class="modal" onclick="event.stopPropagation()">'
      + '<div class="card-title">Respaldo de tus datos</div><div class="card-sub">Selecciona todo el texto y cópialo a un lugar seguro (por ejemplo, Notas o un correo).</div>'
      + '<textarea readonly onclick="this.select()">'+esc(json)+'</textarea>'
      + '<div class="form-actions"><button class="btn btn-primary" data-action="closeModal">Listo</button></div>'
      + '</div></div>';
  }
  return '<div class="modal-overlay" data-action="closeModal"><div class="modal" onclick="event.stopPropagation()">'
    + '<div class="card-title">Cargar respaldo</div><div class="card-sub">Pega aquí el JSON de un respaldo exportado anteriormente.</div>'
    + '<textarea id="import-text" placeholder="Pega el JSON del respaldo aquí..."></textarea>'
    + '<div class="form-actions"><button class="btn btn-ghost" data-action="closeModal">Cancelar</button><button class="btn btn-primary" data-action="confirmImport">Cargar</button></div>'
    + '</div></div>';
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");

  if(action==="tab"){ setState({ tab: el.getAttribute("data-tab"), showForm:false, editId:null, detailId:null, gastoOpenForm:null, abonoFormOpen:false }); return; }
  if(action==="newPedido"){ setState({ showForm:true, editId:null }); return; }
  if(action==="cancelForm"){ setState({ showForm:false, editId:null }); return; }
  if(action==="editPedido"){ setState({ editId: el.getAttribute("data-id"), showForm:true, detailId:null }); return; }
  if(action==="openDetail"){ setState({ detailId: el.getAttribute("data-id") }); return; }
  if(action==="closeDrawer"){ if(e.target===el) setState({ detailId:null }); return; }
  if(action==="deletePedido"){
    var id = el.getAttribute("data-id");
    if(confirm("¿Eliminar este pedido? Esta acción no se puede deshacer.")){
      var next = STATE.pedidos.filter(function(p){ return p.id!==id; });
      STATE.detailId = STATE.detailId===id ? null : STATE.detailId;
      savePedidos(next);
    }
    return;
  }
  if(action==="openGastoForm"){ setState({ gastoOpenForm: el.getAttribute("data-tipo") }); return; }
  if(action==="cancelGastoForm"){ setState({ gastoOpenForm:null }); return; }
  if(action==="removeGasto"){
    var tipo = el.getAttribute("data-tipo"), gid = el.getAttribute("data-id");
    var next = Object.assign({}, STATE.gastos);
    next[tipo] = next[tipo].filter(function(x){ return x.id!==gid; });
    saveGastos(next);
    return;
  }
  if(action==="openAbonoForm"){ setState({ abonoFormOpen:true }); return; }
  if(action==="cancelAbonoForm"){ setState({ abonoFormOpen:false }); return; }
  if(action==="removeAbono"){
    var aid = el.getAttribute("data-id");
    var nextA = Object.assign({}, STATE.gastos);
    nextA.abonosAndres = nextA.abonosAndres.filter(function(x){ return x.id!==aid; });
    saveGastos(nextA);
    return;
  }
  if(action==="openBackupExport"){ setState({ backupModal:"export" }); return; }
  if(action==="openBackupImport"){ setState({ backupModal:"import" }); return; }
  if(action==="closeModal"){ if(e.target===el || el.tagName==="BUTTON") setState({ backupModal:null }); return; }
  if(action==="confirmImport"){
    var ta = document.getElementById("import-text");
    try{
      var data = JSON.parse(ta.value);
      if(data.pedidos) STATE.pedidos = data.pedidos;
      if(data.gastos) STATE.gastos = data.gastos;
      persist();
      setState({ backupModal:null });
    }catch(err){
      alert("Este texto no parece un respaldo válido de Wine&Co.");
    }
    return;
  }
});

document.addEventListener("change", function(e){
  if(e.target.matches('[data-action="filtroCliente"]')){ setState({ filtroCliente: e.target.value }); return; }
  if(e.target.matches('[data-action="filtroTitin"]')){ setState({ filtroTitin: e.target.value }); return; }
  if(e.target.matches('[data-action="statusChange"]')){
    var field = e.target.getAttribute("data-field");
    var patch = {}; patch[field] = e.target.value;
    if(field==="estadoFactura" && e.target.value==="Pagado"){
      var pedido = STATE.pedidos.find(function(p){ return p.id===STATE.detailId; });
      if(pedido && !pedido.fechaPagoFactura) patch.fechaPagoFactura = new Date().toISOString().slice(0,10);
    }
    var next = STATE.pedidos.map(function(p){ return p.id===STATE.detailId ? Object.assign({}, p, patch) : p; });
    savePedidos(next);
    return;
  }
  if(e.target.matches('[data-action="gastoEstadoChange"]')){
    var gTipo = e.target.getAttribute("data-tipo"), gId = e.target.getAttribute("data-id");
    var nextGE = Object.assign({}, STATE.gastos);
    nextGE[gTipo] = nextGE[gTipo].map(function(x){ return x.id===gId ? Object.assign({}, x, { estado: e.target.value }) : x; });
    saveGastos(nextGE);
    return;
  }
});

document.addEventListener("submit", function(e){
  if(e.target.matches('[data-action="submitPedido"]')){
    e.preventDefault();
    var fd = new FormData(e.target);
    var f = Object.fromEntries(fd.entries());
    if(!f.cliente || !f.fechaOrdenCompra || !f.montoVenta){ alert("Completa los campos obligatorios: cliente, fecha de orden de compra y monto de venta."); return; }
    f.montoVenta = Number(f.montoVenta)||0;
    f.montoComision = Number(f.montoComision)||0;
    var next;
    if(STATE.editId){
      next = STATE.pedidos.map(function(p){ return p.id===STATE.editId ? Object.assign({}, p, f) : p; });
    } else {
      next = [Object.assign({ id: uid() }, f)].concat(STATE.pedidos);
    }
    STATE.showForm = false; STATE.editId = null;
    savePedidos(next);
    return;
  }
  if(e.target.matches('[data-action="submitGasto"]')){
    e.preventDefault();
    var tipo = e.target.getAttribute("data-tipo");
    var fd2 = new FormData(e.target);
    var item = Object.fromEntries(fd2.entries());
    var fields = GASTO_FIELDS[tipo];
    for(var i=0;i<fields.length;i++){ if(fields[i].required && !item[fields[i].key]){ alert("Completa los campos obligatorios."); return; } }
    item.monto = Number(item.monto)||0;
    item.estado = "Pendiente";
    var nextG = Object.assign({}, STATE.gastos);
    nextG[tipo] = [Object.assign({ id: uid() }, item)].concat(nextG[tipo]);
    STATE.gastoOpenForm = null;
    saveGastos(nextG);
    return;
  }
  if(e.target.matches('[data-action="submitAbono"]')){
    e.preventDefault();
    var fd3 = new FormData(e.target);
    var abono = Object.fromEntries(fd3.entries());
    for(var j=0;j<ABONO_FIELDS.length;j++){ if(ABONO_FIELDS[j].required && !abono[ABONO_FIELDS[j].key]){ alert("Completa los campos obligatorios."); return; } }
    abono.monto = Number(abono.monto)||0;
    var nextAb = Object.assign({}, STATE.gastos);
    nextAb.abonosAndres = [Object.assign({ id: uid() }, abono)].concat(nextAb.abonosAndres);
    STATE.abonoFormOpen = false;
    saveGastos(nextAb);
    return;
  }
});

render();
</script>
