# Blueprint de Render. Con este archivo en el repositorio, Render configura
# todo solo: https://dashboard.render.com > New > Blueprint > elegir este repo.
services:
  - type: web
    name: appos
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter          # el plan free no permite disco persistente
    healthCheckPath: /salud
    disk:
      name: appos-datos
      mountPath: /app/data # aqui vive appos.db, sobrevive a los despliegues
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /app/data/appos.db
      - key: APPOS_NOMBRE
        value: APPOS
      - key: APPOS_SITIO
        value: https://www.appos.cl
      - key: APPOS_CORREO
        value: contacto@appos.cl
      - key: APPOS_INSTAGRAM
        value: apposchile
      - key: APPOS_VENDEDOR
        value: Alejandro
      - key: SHOPIFY_SHOP_DOMAIN
        value: www.appos.cl
      - key: WHATSAPP_MODE
        value: links
      # Valor de produccion. Si aqui dijera "consola", Render lo volveria a
      # aplicar en cada despliegue y apagaria el envio de correo cada vez que
      # se sube un cambio, en silencio.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: contacto@appos.cl
      - key: EMAIL_FROM_NAME
        value: APPOS
      - key: HORA_RUTINA
        value: "9"
      - key: RESUMEN_DIARIO
        value: "1"
      # Completa esto con la direccion que te asigne Render, para que el
      # correo resumen traiga el enlace directo al panel.
      - key: PANEL_URL
        sync: false
      # Estos se completan a mano en el panel de Render (Environment).
      # sync:false significa que Render los pide en vez de guardarlos en el repo.
      - key: APPOS_WHATSAPP
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      # Opcional: solo para generar reels en /reels. Sin ella esa pagina
      # explica como conseguirla y no llama a ningun servicio.
      - key: RUNAPI_API_KEY
        sync: false
      - key: PANEL_TOKEN
        generateValue: true   # Render inventa una clave segura
